            initLineChart();
            checkVotingStatus();
        };

        function loadLocalVotes() {
            const savedVotes = localStorage.getItem('gamer_poll_votes');
            if (savedVotes) {
                try {
                    pollVotes = JSON.parse(savedVotes);
                } catch(e) {
                    console.error('Erro ao ler votos salvos:', e);
                }
            }
        }

        function saveLocalVotes() {
            localStorage.setItem('gamer_poll_votes', JSON.stringify(pollVotes));
        }
