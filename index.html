<!-- LÓGICA JAVASCRIPT -->
    <script>
        // Configuração dos Jogos
        const gamesData = [
            { name: 'The Witcher 3', color: '#00f3ff' },
            { name: 'Red Dead 2', color: '#ff007f' },
            { name: 'Euro Truck 2', color: '#9d4edd' },
            { name: 'Counter-Strike 2', color: '#00ff66' }
        ];

        // 1. ZERADOS OS VALORES INICIAIS
        let pollVotes = [0, 0, 0, 0]; 
        let chartInstance = null;

        window.onload = function() {
            // 2. DESCOMENTE A LINHA ABAIXO CASO QUEIRA RESETAR O VOTO SALVO NO NAVEGADOR TAMBÉM:
            // localStorage.removeItem('gamer_poll_votes');
            // localStorage.removeItem('gamer_poll_has_voted');

            loadLocalVotes();
            initLineChart();
            checkVotingStatus();
        };

        function loadLocalVotes() {
            const savedVotes = localStorage.getItem('gamer_poll_votes');
            if (savedVotes) {
                try {
                    pollVotes = JSON.parse(savedVotes);
                } catch(e) {
                    console.error('Erro ao ler votos salvos:', e);
                }
            }
        }

        function saveLocalVotes() {
            localStorage.setItem('gamer_poll_votes', JSON.stringify(pollVotes));
        }

        // Inicializar GRÁFICO DE LINHA (Line Chart)
        function initLineChart() {
            const ctx = document.getElementById('popularityChart').getContext('2d');
            
            // Criando gradiente para o preenchimento da linha
            const gradient = ctx.createLinearGradient(0, 0, 0, 250);
            gradient.addColorStop(0, 'rgba(0, 243, 255, 0.35)');
            gradient.addColorStop(1, 'rgba(0, 243, 255, 0.0)');

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: gamesData.map(g => g.name),
                    datasets: [{
                        label: 'Votos Registrados',
                        data: pollVotes,
                        borderColor: '#00f3ff',
                        borderWidth: 3,
                        pointBackgroundColor: gamesData.map(g => g.color),
                        pointBorderColor: '#050508',
                        pointBorderWidth: 2,
                        pointRadius: 6,
                        pointHoverRadius: 9,
                        pointHoverBorderWidth: 3,
                        fill: true,
                        backgroundColor: gradient,
                        tension: 0.35 // Curvatura da linha estilo neon
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#0d0d12',
                            titleFont: { family: 'Orbitron', size: 14 },
                            bodyFont: { family: 'Rajdhani', size: 14 },
                            borderColor: '#00f3ff',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: false,
                            callbacks: {
                                label: function(context) {
                                    const total = pollVotes.reduce((a, b) => a + b, 0);
                                    const val = context.raw || 0;
                                    const pct = total > 0 ? ((val / total) * 100).toFixed(1) : 0;
                                    return ` Votos: ${val} (${pct}%)`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.03)' },
                            ticks: {
                                color: '#94a3b8',
                                font: { family: 'Orbitron', size: 11 }
                            }
                        },
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: {
                                color: '#94a3b8',
                                font: { family: 'Rajdhani', size: 13 },
                                precision: 0
                            }
                        }
                    }
                }
            });

            updateStatsList();
        }

        function updateStatsList() {
            const total = pollVotes.reduce((a, b) => a + b, 0);
            const statsContainer = document.getElementById('statsList');
            document.getElementById('totalVotesCount').innerText = `Total: ${total} votos`;

            statsContainer.innerHTML = '';

            gamesData.forEach((game, index) => {
                const count = pollVotes[index];
                const pct = total > 0 ? ((count / total) * 100).toFixed(1) : 0;

                const itemHTML = `
                    <div class="space-y-1">
                        <div class="flex justify-between items-center text-xs font-semibold">
                            <span class="text-slate-300 flex items-center gap-1.5 font-orbitron">
                                <span class="w-2.5 h-2.5 rounded-full inline-block" style="background-color: ${game.color}"></span>
                                ${game.name}
                            </span>
                            <span class="font-mono text-slate-400">${count} voto(s) <span class="text-white">(${pct}%)</span></span>
                        </div>
                        <div class="w-full h-2 bg-black/60 rounded-full overflow-hidden border border-slate-800">
                            <div class="h-full rounded-full transition-all duration-500" style="width: ${pct}%; background-color: ${game.color}"></div>
                        </div>
                    </div>
                `;
                statsContainer.innerHTML += itemHTML;
            });
        }

        function castVote(gameIndex) {
            const hasVoted = localStorage.getItem('gamer_poll_has_voted');

            if (hasVoted) {
                showAlert('Você já registrou seu voto nesta enquete!', 'warning');
                disableVoteButtons();
                return;
            }

            pollVotes[gameIndex]++;
            saveLocalVotes();
            localStorage.setItem('gamer_poll_has_voted', 'true');

            chartInstance.data.datasets[0].data = pollVotes;
            chartInstance.update();
            updateStatsList();

            showAlert(`Voto computado com sucesso no jogo: ${gamesData[gameIndex].name}!`, 'success');
            checkVotingStatus();
        }

        function checkVotingStatus() {
            const hasVoted = localStorage.getItem('gamer_poll_has_voted');
            const badge = document.getElementById('votedStatusBadge');

            if (hasVoted) {
                badge.innerText = "Status: Voto Registrado";
                badge.className = "text-xs px-3 py-1 rounded-md bg-neoncyan/10 text-neoncyan font-semibold border border-neoncyan/40";
                disableVoteButtons();
            } else {
                badge.innerText = "Status: Não Votado";
                badge.className = "text-xs px-3 py-1 rounded-md bg-slate-900 text-slate-400 font-semibold border border-slate-800";
            }
        }

        function disableVoteButtons() {
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`btn-vote-${i}`);
                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = `<i class="fa-solid fa-lock mr-1.5"></i> Votado`;
                }
            }
        }

        function showAlert(msg, type) {
            const alertBox = document.getElementById('alertBox');
            const alertContent = document.getElementById('alertContent');
            const alertIcon = document.getElementById('alertIcon');
            const alertMessage = document.getElementById('alertMessage');

            alertMessage.innerText = msg;
            alertBox.classList.remove('hidden');

            if (type === 'warning') {
                alertContent.className = "p-4 rounded-xl flex items-center justify-between border border-amber-500/50 bg-amber-950/80 text-amber-300 backdrop-blur-md shadow-lg";
                alertIcon.className = "fa-solid fa-triangle-exclamation text-amber-400";
            } else if (type === 'success') {
                alertContent.className = "p-4 rounded-xl flex items-center justify-between border border-emerald-500/50 bg-emerald-950/80 text-emerald-300 backdrop-blur-md shadow-lg";
                alertIcon.className = "fa-solid fa-circle-check text-emerald-400";
            } else {
                alertContent.className = "p-4 rounded-xl flex items-center justify-between border border-cyan-500/50 bg-cyan-950/80 text-cyan-300 backdrop-blur-md shadow-lg";
                alertIcon.className = "fa-solid fa-circle-info text-cyan-400";
            }
        }

        function dismissAlert() {
            document.getElementById('alertBox').classList.add('hidden');
        }
    </script>
